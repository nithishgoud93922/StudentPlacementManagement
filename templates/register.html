
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | PlacementHub</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #eaf0ff;
            background: #081225;
        }
        .card {
            width: 100%;
            max-width: 480px;
            padding: 32px;
            border: 1px solid #273a59;
            border-radius: 18px;
            background: #111e35;
            box-shadow: 0 20px 60px #0005;
        }
        h1 { margin: 0 0 8px; font-size: 28px; }
        .subtitle { color: #aab9d3; margin-bottom: 26px; }
        label { display: block; margin: 16px 0 7px; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #354968;
            border-radius: 9px;
            color: #fff;
            background: #0b172b;
            font-size: 15px;
        }
        input:focus, select:focus {
            outline: 2px solid #42a5ff;
            border-color: transparent;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            color: #061225;
            background: #55c5ff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #8bd8ff; }
        .message { margin: 14px 0; color: #ffb5b5; }
        .footer { margin-top: 20px; text-align: center; color: #aab9d3; }
        a { color: #70cfff; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Create your account</h1>
        <p class="subtitle">Join the student placement platform.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p class="message">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <label for="full_name">Full name</label>
            <input id="full_name" name="full_name"
                   type="text" maxlength="120" required>

            <label for="email">Email address</label>
            <input id="email" name="email"
                   type="email" maxlength="150" required>

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password" minlength="8" required>

            <label for="role">Account type</label>
            <select id="role" name="role" required>
                <option value="student">Student</option>
                <option value="recruiter">Recruiter</option>
            </select>

            <button type="submit">Create account</button>
        </form>

        <p class="footer">
            Already registered?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>
    </main>
</body>
</html>
